name: GPMorgan Forge CI/CD Quality & Coverage Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Static Analysis, Linting & Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.15
        run: uv python install 3.15

      - name: Install project and development dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run Mypy strict static type checker
        run: uv run mypy src tests

      - name: Run Markdown linter (rumdl)
        run: uv run rumdl check .

      - name: Audit repository standards and deliverables
        run: uv run python scripts/verify_commit_msg.py --audit-repo

  test-and-coverage:
    name: Unit, Integration & Portfolio Verification Suite (100% Coverage Gate)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.15
        run: uv python install 3.15

      - name: Install project and development dependencies
        run: uv sync --all-extras --dev

      - name: Execute Pytest with 100% line and branch coverage gate
        run: uv run pytest --cov=src/gpmorgan_forge --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Execute Portfolio Evidence Generator CLI
        run: uv run python -m gpmorgan_forge.evidence_generator --verify

  docker-compose-validation:
    name: Validate Modern Compose Specification & Image Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate compose.yaml specification
        run: docker compose -f compose.yaml --profile full config -q

      - name: Build and verify container image
        run: docker build --target runtime -t gpmorgan-forge:ci .

      - name: Execute 100% test suite inside container
        run: docker run --rm gpmorgan-forge:ci
