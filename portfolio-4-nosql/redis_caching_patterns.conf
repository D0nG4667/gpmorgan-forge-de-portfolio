# Portfolio 4: NoSQL and Advanced Data Models
# =============================================================================

# -----------------------------------------------------------------------------
# Pattern 1: Two-Tier Atomic Idempotency Defence (Redis 8.0 / Valkey + PostgreSQL)
#   - Tier 1 (Fast-Path Filter): Redis 8.0 / Valkey `SET ... NX EX 86400` rejects
#     duplicate mobile/NIP network retries in sub-millisecond memory latency.
#   - Tier 2 (Durable Ledger Enforcement): Mandatory `uq_transactions_idempotency_key`
#     UNIQUE constraint in PostgreSQL 18 / CockroachDB ensures that even if a
#     Redis key expires after TTL or a cache node fails over, duplicate payment
#     settlement is mathematically impossible.
# -----------------------------------------------------------------------------
SET forge:idemp:IDEMP-TRF-2026-0005 "{\"tx_id\":\"50000000-0000-4000-8000-000000000005\",\"status\":\"SETTLED\"}" NX EX 86400
GET forge:idemp:IDEMP-TRF-2026-0005
TTL forge:idemp:IDEMP-TRF-2026-0005

# -----------------------------------------------------------------------------
# Pattern 2: Read-Through Account Balance & Risk Summary Cache (HASH + TTL)
# Offloads high-frequency mobile dashboard reads from PostgreSQL Primary.
# -----------------------------------------------------------------------------
HSET forge:account:2000000002:summary account_number "2000000002" currency "NGN" balance "12000000.0000" available_balance "12000000.0000" version "4" status "ACTIVE"
EXPIRE forge:account:2000000002:summary 60
HGETALL forge:account:2000000002:summary

# -----------------------------------------------------------------------------
# Pattern 3: Sliding-Window API Rate Limiting (Sorted Set ZSET)
# Enforces max 10 transfer initiation requests per 60-second window per customer.
# -----------------------------------------------------------------------------
ZREMRANGEBYSCORE forge:ratelimit:CUST-NG-00102:transfer 0 1762603140000
ZADD forge:ratelimit:CUST-NG-00102:transfer 1762603200001 "req-001"
ZCARD forge:ratelimit:CUST-NG-00102:transfer
EXPIRE forge:ratelimit:CUST-NG-00102:transfer 60
