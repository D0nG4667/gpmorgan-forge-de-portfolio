forge_lakehouse:
  target: trino
  outputs:
    trino:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'trino') }}"
      port: "{{ env_var('TRINO_INTERNAL_PORT', '8080') | as_number }}"
      user: "{{ env_var('TRINO_DBT_USER', 'forge_dbt') }}"
      database: iceberg
      schema: forge_dwh
      threads: 4
