# Trino Iceberg connector backed by the Apache Polaris REST catalog (credential vending).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris-catalog:8181/api/catalog
iceberg.rest-catalog.warehouse=forge_lakehouse
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_OAUTH_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
fs.native-s3.enabled=true
s3.region=${ENV:AWS_REGION}
